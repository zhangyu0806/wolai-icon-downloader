<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wolai 日历图标下载器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      padding: 40px;
      min-height: 100vh;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 32px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #6e6e73;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="date"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      font-size: 16px;
      background: #fff;
      transition: border-color 0.2s;
    }

    input[type="date"]:focus {
      outline: none;
      border-color: #0071e3;
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.1);
    }

    .date-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .color-btn {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }

    .color-btn:hover { transform: scale(1.1); }
    .color-btn.active { border-color: #1d1d1f; transform: scale(1.15); }

    .color-btn[data-color="red"] { background: #cf5659; }
    .color-btn[data-color="blue"] { background: #5aa9e6; }
    .color-btn[data-color="green"] { background: #5fbb97; }
    .color-btn[data-color="yellow"] { background: #dbad6a; }
    .color-btn[data-color="pink"] { background: #EA5D97; }

    .save-dir {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .save-dir input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      font-size: 14px;
      background: #fff;
    }

    .save-dir button {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #e8e8ed;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }

    .save-dir button:hover { background: #d2d2d7; }

    .download-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #0071e3;
      color: #fff;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 24px;
    }

    .download-btn:hover { background: #0077ed; }
    .download-btn:active { transform: scale(0.98); }
    .download-btn:disabled { background: #86868b; cursor: not-allowed; }

    .progress-area {
      margin-top: 24px;
      display: none;
    }

    .progress-area.active { display: block; }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #e8e8ed;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #0071e3;
      border-radius: 3px;
      transition: width 0.3s;
      width: 0%;
    }

    .progress-text {
      margin-top: 8px;
      font-size: 13px;
      color: #6e6e73;
      text-align: center;
    }

    .result {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    .result.success { display: block; background: #d4edda; color: #155724; }
    .result.error { display: block; background: #f8d7da; color: #721c24; }

    .preview-area {
      margin-top: 24px;
      text-align: center;
    }

    .preview-area img {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📅 Wolai 日历图标下载器</h1>

    <div class="form-group">
      <label>日期范围</label>
      <div class="date-row">
        <input type="date" id="startDate" value="2024-01-01">
        <input type="date" id="endDate" value="2024-12-31">
      </div>
    </div>

    <div class="form-group">
      <label>图标颜色</label>
      <div class="color-grid">
        <button class="color-btn active" data-color="red" title="红色"></button>
        <button class="color-btn" data-color="blue" title="蓝色"></button>
        <button class="color-btn" data-color="green" title="绿色"></button>
        <button class="color-btn" data-color="yellow" title="黄色"></button>
        <button class="color-btn" data-color="pink" title="粉色"></button>
      </div>
    </div>

    <div class="form-group">
      <label>保存位置</label>
      <div class="save-dir">
        <input type="text" id="saveDir" placeholder="选择保存目录..." readonly>
        <button id="chooseDirBtn">浏览...</button>
      </div>
    </div>

    <button class="download-btn" id="downloadBtn">开始下载</button>

    <div class="progress-area" id="progressArea">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="progress-text" id="progressText">准备中...</div>
    </div>

    <div class="result" id="result"></div>

    <div class="preview-area" id="previewArea"></div>
  </div>

  <script type="module">
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const { open } = window.__TAURI__.dialog;

    let selectedColor = 'red';

    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedColor = btn.dataset.color;
      });
    });

    document.getElementById('chooseDirBtn').addEventListener('click', async () => {
      const dir = await open({ directory: true, title: '选择保存目录' });
      if (dir) {
        document.getElementById('saveDir').value = dir;
      }
    });

    document.getElementById('downloadBtn').addEventListener('click', async () => {
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      const saveDir = document.getElementById('saveDir').value;

      if (!startDate || !endDate) {
        showResult('请选择日期范围', 'error');
        return;
      }
      if (!saveDir) {
        showResult('请选择保存目录', 'error');
        return;
      }

      const btn = document.getElementById('downloadBtn');
      btn.disabled = true;
      btn.textContent = '下载中...';

      const progressArea = document.getElementById('progressArea');
      progressArea.classList.add('active');
      hideResult();

      try {
        const result = await invoke('download_icons', {
          request: {
            start_date: startDate,
            end_date: endDate,
            color: selectedColor,
            save_dir: saveDir,
          }
        });
        showResult(result, 'success');
      } catch (e) {
        showResult(e, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '开始下载';
      }
    });

    listen('download-progress', (event) => {
      const { current, total, filename, success } = event.payload;
      const percent = Math.round((current / total) * 100);
      document.getElementById('progressBar').style.width = percent + '%';
      document.getElementById('progressText').textContent = 
        `${current}/${total} - ${filename} ${success ? '✓' : '✗'}`;
    });

    function showResult(msg, type) {
      const el = document.getElementById('result');
      el.textContent = msg;
      el.className = 'result ' + type;
    }

    function hideResult() {
      document.getElementById('result').className = 'result';
    }
  </script>
</body>
</html>
